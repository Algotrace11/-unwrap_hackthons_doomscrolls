name: Automated Instagram Hackathon Publisher

on:
  schedule:
    # 16:30 UTC = 22:00 IST (10:00 PM IST - Peak Late Night Overnight Slot)
    - cron: '30 16 * * *'
    # 07:30 UTC = 13:00 IST (01:00 PM IST - Afternoon Lunch Slot)
    - cron: '30 7 * * *'
  workflow_dispatch: # Allows manual 1-click test trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  publish_or_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automation (Live Publish or Test Preview)
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ -n "$INSTAGRAM_ACCOUNT_ID" ] && [ "$INSTAGRAM_ACCOUNT_ID" != "your_instagram_account_id" ]; then
            echo "🔑 Instagram credentials detected. Running in LIVE publish mode..."
            python run.py --publish
          else
            echo "🧪 Instagram credentials not configured yet. Running in TEST / DRY-RUN mode..."
            python run.py --dry-run
          fi

      - name: Commit and Push Database State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/automation.db
          git diff --staged --quiet || (git commit -m "chore: update database tracking state [skip ci]" && git push)
